<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>足踝运动与肌肉教具 · 动小学</title><script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script><style>body{margin:0;background:#edf2f3;color:#24465e;font:15px/1.8 "Microsoft YaHei",sans-serif}header{max-width:1140px;margin:25px auto;display:flex;justify-content:space-between;padding:0 24px}a{color:#356c91}main{max-width:1140px;margin:25px auto;padding:0 24px 35px;display:grid;grid-template-columns:300px 1fr;gap:28px}h1{font-size:29px;font-weight:550;line-height:1.4;margin:13px 0}h2{font-size:16px;margin:25px 0 7px}.kicker{font-size:11px;color:#8294a1;letter-spacing:.12em}.intro{font-size:14px;color:#657c8c}.point{padding:15px 17px;background:#fffefa;border:1px solid #d9e3e6;border-radius:12px;margin:12px 0;font-size:13px}.point b{display:block;margin-bottom:5px;color:#2c5877}.note{font-size:11px;color:#7b8c97}.model{min-width:0}footer{font-size:11px;color:#7b8c97;margin-top:17px}@media(max-width:850px){main{grid-template-columns:1fr}.lesson{max-width:650px}header{font-size:12px}h1{font-size:25px}}</style></head><body><header><b>动小学 · 人体运动学</b><a href="index.html?demo=1">返回接诊诊室 →</a></header><main><section class="lesson"><span class="kicker">从结构到日常活动</span><h1>转动脚踝，<br>看清运动怎样发生。</h1><p class="intro">滑动控制运动，显示运动轴与运动面；添加肌肉，再看结构与功能的关系。</p><div class="point"><b>踝关节背屈与跖屈</b>背屈使足背靠近小腿，跖屈使足背远离小腿。观察横轴与矢状面投影。</div><div class="point"><b>足内翻与外翻</b>内翻时足底朝内，外翻时足底朝外。它涉及距下等多个关节，不能都当作单一踝关节运动。</div><div class="point"><b>添加肌肉，理解作用方向</b>点选胫骨前肌、小腿三头肌、胫骨后肌与腓骨肌，比较关节前后与内外侧的位置。肌肉按图谱中立位显示。</div><p class="note">运动为有限教学演示，角度不是患者测量值或正常值范围。实际足踝轴线有倾斜与耦合，不能用本页诊断。</p><footer><a href="docs/anatomy-v10-provenance.json">查看模型来源、许可与运动制作记录</a></footer></section><section class="model" id="anatomyPage" aria-label="足踝三维解剖教具"></section></main><script type="module">import {createAnatomyViewer} from './anatomy-viewer.js';const host=document.getElementById('anatomyPage');createAnatomyViewer(host).catch(()=>{host.textContent='解剖资源暂未载入，请刷新重试。';});</script></body></html>
